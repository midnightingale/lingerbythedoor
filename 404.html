<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>linger</title>
    <script>
      // SPA redirect for GitHub Pages
      // Redirects all 404s to index.html with the path in query string
      const path = window.location.pathname.replace('/lingerbythedoor', '');
      const query = window.location.search;
      window.location.replace(
        window.location.origin + '/lingerbythedoor/' +
        '?p=' + encodeURIComponent(path + query)
      );
    </script>
  </head>
  <body></body>
</html>
