<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>linger</title>
    <script>
      // SPA redirect for GitHub Pages
      // Redirects all 404s to index.html with the path in query string
      const path = window.location.pathname;
      const query = window.location.search;
      // Find the base path (everything up to and including the repo name)
      const base = path.match(/^\/[^/]+\//)?.[0] || '/';
      window.location.replace(
        window.location.origin + base +
        '?p=' + encodeURIComponent(path.replace(base.slice(0, -1), '') + query)
      );
    </script>
  </head>
  <body></body>
</html>
