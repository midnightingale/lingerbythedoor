<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>linger</title>
    <script>
      // SPA redirect for GitHub Pages
      // GitHub Pages returns 404 for client-side routes like /call/abc
      // This redirects to index.html with the path preserved in a query param
      const fullPath = window.location.pathname + window.location.search;
      const base = window.location.pathname.match(/^\/[^/]+\//)?.[0] || '/';
      window.location.replace(
        window.location.origin + base + '?p=' + encodeURIComponent(fullPath)
      );
    </script>
  </head>
  <body></body>
</html>
